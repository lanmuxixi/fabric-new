# This is the default base file to config env and command
# Notice that chaincode is executed inside docker in default net mode
# https://github.com/yeasy/docker-compose-files

# Depends on the hyperledger/fabric-peer image.

# This utilized the pbft as consensus
# See https://github.com/hyperledger/fabric/blob/master/docs/dev-setup/devnet-setup.md#using-consensus-plugin for more details.

version: '2'

services:
  vp: # vp node no needing membersrvc
    image: peer-image
    #image: yeasy/hyperledger-fabric-peer:0.6-dp
    #image: hyperledger/fabric-peer:x86_64-0.6.1-preview
    #image: ibmblockchain/fabric-peer:x86_64-0.6.1-preview
    restart: unless-stopped
    environment:
      - CORE_PEER_ADDRESSAUTODETECT=true
      - CORE_PEER_NETWORKID=dev
      - CORE_LOGGING_LEVEL=info  #critical, error, warning, notice, info, debug
      #- CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_pbft  # uncomment this to use specific network
      # The following section enables pbft consensus
      - CORE_PEER_VALIDATOR_CONSENSUS_PLUGIN=pbft  # noops, pbft
      - CORE_PBFT_GENERAL_MODE=batch  # batch. classic and sieve will be not supported again.
      - CORE_PBFT_GENERAL_N=10
      - CORE_PBFT_GENERAL_F=3
      #      - CORE_PBFT_GENERAL_BATCHSIZE=5  # only useful when in batch mode
      - CORE_PBFT_GENERAL_TIMEOUT_BATCH=5s #1s
      - CORE_PBFT_GENERAL_TIMEOUT_REQUEST=2s #2s
      - CORE_PBFT_GENERAL_TIMEOUT_VIEWCHANGE=6s #2s 
      - CORE_PBFT_GENERAL_TIMEOUT_BROADCAST=2s
      - CORE_PBFT_GENERAL_BROADCAST=1s #1s
      - CORE_CHAINCODE_DEPLOYTIMEOUT=300000000000
      - CORE_PEER_VALIDATOR_CONSENSUS_BUFFERSIZE=20000
      - CORE_PEER_VALIDATOR_EVENTS_BUFFERSIZE=1000
      - CORE_PEER_VALIDATOR_EVENTS_TIMEOUT=20
    expose:
      - "7050"  # Rest
      - "7051"  # Grpc
      - "7052"  # Peer CLI
      - "7053"  # Peer Event
      - "7054"  # eCAP
      - "7055"  # eCAA
      - "7056"  # tCAP
      - "7057"  # eCAA
      - "7058"  # tlsCAP
      - "7059"  # tlsCAA
    volumes: # docker.sock is mapped as the default CORE_VM_ENDPOINT
      - /var/run/docker.sock:/var/run/docker.sock
    command: peer node start  # this repeats the default cmd to make sure
  # command: sh -c "sleep 5; peer node start"  # peer node should have booting delay with CA
  vp_debug: # vp node no needing membersrvc
    image: peer-image
    # image: yeasy/hyperledger-fabric-peer:0.6-dp
    # image: hyperledger/fabric-peer:x86_64-0.6.1-preview
    # image: ibmblockchain/fabric-peer:x86_64-0.6.1-preview
    security_opt:
      - apparmor:unconfined
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped
    environment:
      - CORE_PEER_ADDRESSAUTODETECT=true
      - CORE_PEER_NETWORKID=dev
      - CORE_LOGGING_LEVEL=info  #critical, error, warning, notice, info, debug
      #- CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_pbft  # uncomment this to use specific network
      # The following section enables pbft consensus
      - CORE_PEER_VALIDATOR_CONSENSUS_PLUGIN=pbft  # noops, pbft
      - CORE_PBFT_GENERAL_MODE=batch  # batch. classic and sieve will be not supported again.
      - CORE_PBFT_GENERAL_N=22
      - CORE_PBFT_GENERAL_F=7
      #      - CORE_PBFT_GENERAL_BATCHSIZE=2  # only useful when in batch mode
      # - CORE_PBFT_GENERAL_TIMEOUT_VIEWCHANGE=1000s
      # - CORE_CHAINCODE_DEPLOYTIMEOUT=300000000000
      - CORE_PBFT_GENERAL_TIMEOUT_BATCH=5s
      - CORE_PBFT_GENERAL_TIMEOUT_REQUEST=10s
      - CORE_PBFT_GENERAL_TIMEOUT_VIEWCHANGE=300s
      - CORE_CHAINCODE_DEPLOYTIMEOUT=300000000000
    expose:
      - "7050"  # Rest
      - "7051"  # Grpc
      - "7052"  # Peer CLI
      - "7053"  # Peer Event
      - "7054"  # eCAP
      - "7055"  # eCAA
      - "7056"  # tCAP
      - "7057"  # eCAA
      - "7058"  # tlsCAP
      - "7059"  # tlsCAA
      - "6060"  # profile
    ports:
      - "8080:8080"
      - "40000:40000"
    volumes: # docker.sock is mapped as the default CORE_VM_ENDPOINT
      - /var/run/docker.sock:/var/run/docker.sock
    # 容器启动后附加调试或者执行调试
    command: peer node start  # this repeats the default cmd to make sure
    
    # 容器启动时调试 peer node start
    # command: dlv --listen=:40000 --headless=true --api-version=2 --accept-multiclient exec /go/bin/peer -- node start  # this repeats the default cmd to make sure
    
    # command: sh -c "sleep 5; peer node start"  # peer node should have booting delay with CA

  vp_sec: # vp node needing membersrvc suppot
    extends:
      service: vp
    environment:
      - CORE_SECURITY_ENABLED=true
      - CORE_PEER_PKI_ECA_PADDR=membersrvc0:7054
      - CORE_PEER_PKI_TCA_PADDR=membersrvc0:7054
      - CORE_PEER_PKI_TLSCA_PADDR=membersrvc0:7054
