version: '2'
        
# 固定ip
# 0 3 6 9 12 15 18 bz
services:
# validating node as the root
# vp0 will also be used for client interactive operations
# If you want to run fabric command on the host, then map 7051:7051 to host
# port, or use like `CORE_PEER_ADDRESS=172.17.0.2:7051` to specify peer addr.
  vp0:
    extends:
      file: peer.yml
      # service: vp
      service: vp
    hostname: vp0
    environment:
      - CORE_PEER_ID=vp0

      # 恶意节点
      - CORE_PBFT_GENERAL_BYZANTINE=true

    ports:
      - "7050:7050"
      # - "7051:7051" 
    networks:
      nacosnat:
        ipv4_address: 10.100.20.20
    

  # validating node
  vp1:
    extends:
      file: peer.yml
      service: vp
      # service: vp_debug
    hostname: vp1
    environment:
      - CORE_PEER_ID=vp1
      - CORE_PEER_DISCOVERY_ROOTNODE=vp0:7051
    links:
      - vp0
    networks:
      nacosnat:
        ipv4_address: 10.100.20.21
    

