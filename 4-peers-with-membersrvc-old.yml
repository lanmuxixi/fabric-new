# This compose file will start a cluster with 4 hyperledger peer nodes
#  vp0: validating node as root
#  vp1: validating node as peer
#  vp2: validating node as peer
#  vp3: validating node as peer
# https://github.com/yeasy/docker-compose-files

version: '2'

services:
  # validating node as the root
  # vp0 will also be used for client interactive operations
  # If you want to run fabric command on the host, then map 7051:7051 to host
  # port, or use like `CORE_PEER_ADDRESS=172.17.0.2:7051` to specify peer addr.
  vp0:
    extends:
      file: peer.yml
      # service: vp
      service: vp_debug
    hostname: vp0
    environment:
      - CORE_PEER_ID=vp0
      # 恶意节点
      - CORE_PBFT_GENERAL_BYZANTINE=false

      # expose:
      # - "40000"
    ports:
      - "7050:7050"
      - "6060:6060"
      #- "7051:7051"

  # validating node
  vp1:
    extends:
      file: peer.yml
      service: vp
      # service: vp_debug
    hostname: vp1
    environment:
      - CORE_PEER_ID=vp1
      - CORE_PEER_DISCOVERY_ROOTNODE=vp0:7051
    links:
      - vp0

  # validating node
  vp2:
    extends:
      file: peer.yml
      service: vp
    hostname: vp2
    environment:
      - CORE_PEER_ID=vp2
      - CORE_PEER_DISCOVERY_ROOTNODE=vp0:7051
      - CORE_PBFT_GENERAL_BYZANTINE=false
    links:
      - vp0


  # validating node
  vp3:
    extends:
      file: peer.yml
      service: vp
    hostname: vp3
    environment:
      - CORE_PEER_ID=vp3
      - CORE_PEER_DISCOVERY_ROOTNODE=vp0:7051
    links:
      - vp0
  nvp0:
    extends:
      file: peer.yml
      service: vp
    hostname: nvp0
    environment:
      - CORE_PEER_VALIDATOR_ENABLED=false
      - CORE_PEER_ID=nvp0
      - CORE_PEER_DISCOVERY_ROOTNODE=vp0:7051
    links:
      - vp0
    command: sh -c "sleep 10; peer node start"
