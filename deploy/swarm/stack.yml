        constraints:
          - node.hostname == ${VP8_NODE:-dns-bind-01}

  vp9:
    <<: *peer-common
    hostname: vp9
    command: /bin/sh -c "sleep ${PEER_START_DELAY:-10}; peer node start"
    environment:
      <<: *peer-env
      CORE_PEER_ID: vp9
      CORE_PEER_ADDRESS: vp9:7051
      CORE_PEER_DISCOVERY_ROOTNODE: vp0:7051
