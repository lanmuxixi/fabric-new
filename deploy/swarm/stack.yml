version: "3.8"

x-peer-common: &peer-common
  image: ${FABRIC_PEER_IMAGE:?Set FABRIC_PEER_IMAGE before deploying the stack}
  networks:
    - fabric
  stop_grace_period: 30s

x-peer-env: &peer-env
  CORE_PEER_ADDRESSAUTODETECT: "false"
  CORE_PEER_NETWORKID: ${CORE_PEER_NETWORKID:-dev}
  CORE_LOGGING_LEVEL: ${CORE_LOGGING_LEVEL:-info}
  CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
  CORE_VM_ENDPOINT: unix:///var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: ${SWARM_NETWORK:-fabric_dns}
  CORE_PEER_VALIDATOR_CONSENSUS_PLUGIN: pbft
  CORE_PBFT_GENERAL_MODE: batch
  CORE_PBFT_GENERAL_N: ${CORE_PBFT_GENERAL_N:-30}
  CORE_PBFT_GENERAL_F: ${CORE_PBFT_GENERAL_F:-9}
  CORE_PBFT_GENERAL_BATCHSIZE: ${CORE_PBFT_GENERAL_BATCHSIZE:-500}
  CORE_PBFT_GENERAL_TIMEOUT_BATCH: ${CORE_PBFT_GENERAL_TIMEOUT_BATCH:-1s}
  CORE_PBFT_GENERAL_TIMEOUT_REQUEST: ${CORE_PBFT_GENERAL_TIMEOUT_REQUEST:-24h}
  CORE_PBFT_GENERAL_TIMEOUT_VIEWCHANGE: ${CORE_PBFT_GENERAL_TIMEOUT_VIEWCHANGE:-24h}
  CORE_PBFT_GENERAL_TIMEOUT_RESENDVIEWCHANGE: ${CORE_PBFT_GENERAL_TIMEOUT_RESENDVIEWCHANGE:-24h}
  CORE_PBFT_GENERAL_TIMEOUT_BROADCAST: ${CORE_PBFT_GENERAL_TIMEOUT_BROADCAST:-2s}
  CORE_PBFT_GENERAL_VIEWCHANGEPERIOD: ${CORE_PBFT_GENERAL_VIEWCHANGEPERIOD:-0}
  CORE_CHAINCODE_DEPLOYTIMEOUT: ${CORE_CHAINCODE_DEPLOYTIMEOUT:-300000000000}
  CORE_PEER_VALIDATOR_CONSENSUS_BUFFERSIZE: ${CORE_PEER_VALIDATOR_CONSENSUS_BUFFERSIZE:-20000}
  CORE_PEER_VALIDATOR_EVENTS_BUFFERSIZE: ${CORE_PEER_VALIDATOR_EVENTS_BUFFERSIZE:-1000}
  CORE_PEER_VALIDATOR_EVENTS_TIMEOUT: ${CORE_PEER_VALIDATOR_EVENTS_TIMEOUT:-20}
  CORE_DNS_SUBNET: ${CORE_DNS_SUBNET:-10.161.34.0/24}

services:
  vp0:
    <<: *peer-common
    hostname: vp0
    command: peer node start
    environment:
      <<: *peer-env
      CORE_PEER_ID: vp0
      CORE_PEER_ADDRESS: vp0:7051
      CORE_PEER_PROFILE_ENABLED: "true"
      CORE_PBFT_GENERAL_BYZANTINE: ${VP0_BYZANTINE:-false}
    ports:
      - target: 7050
        published: ${VP0_REST_PORT:-7050}
        protocol: tcp
        mode: host
      - target: 7051
        published: ${VP0_GRPC_PORT:-7051}
        protocol: tcp
        mode: host
      - target: 7053
        published: ${VP0_EVENTS_PORT:-7053}
        protocol: tcp
        mode: host
      - target: 6060
        published: ${VP0_PROFILE_PORT:-6060}
        protocol: tcp
        mode: host
    volumes:
      - type: volume
        source: vp0-data
        target: /var/hyperledger/production
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${VP0_NODE:-roott-I620-G20}

  vp1:
    <<: *peer-common
    hostname: vp1
    command: /bin/sh -c "sleep ${PEER_START_DELAY:-10}; peer node start"
    environment:
      <<: *peer-env
      CORE_PEER_ID: vp1
      CORE_PEER_ADDRESS: vp1:7051
      CORE_PEER_DISCOVERY_ROOTNODE: vp0:7051
      CORE_PBFT_GENERAL_BYZANTINE: ${VP1_BYZANTINE:-false}
    volumes:
