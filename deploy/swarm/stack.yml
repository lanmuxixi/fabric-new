    command: /bin/sh -c "sleep ${PEER_START_DELAY:-10}; peer node start"
    environment:
      <<: *peer-env
      CORE_PEER_ID: vp27
      CORE_PEER_ADDRESS: vp27:7051
      CORE_PEER_DISCOVERY_ROOTNODE: vp0:7051
      CORE_PBFT_GENERAL_BYZANTINE: ${VP27_BYZANTINE:-false}
    volumes:
      - type: volume
        source: vp27-data
        target: /var/hyperledger/production
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${VP27_NODE:-qichang-I420-G20}

  vp28:
    <<: *peer-common
    hostname: vp28
    command: /bin/sh -c "sleep ${PEER_START_DELAY:-10}; peer node start"
    environment:
      <<: *peer-env
      CORE_PEER_ID: vp28
      CORE_PEER_ADDRESS: vp28:7051
      CORE_PEER_DISCOVERY_ROOTNODE: vp0:7051
      CORE_PBFT_GENERAL_BYZANTINE: ${VP28_BYZANTINE:-false}
    volumes:
      - type: volume
        source: vp28-data
        target: /var/hyperledger/production
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${VP28_NODE:-qichang-I420-G20}

  vp29:
    <<: *peer-common
    hostname: vp29
    command: /bin/sh -c "sleep ${PEER_START_DELAY:-10}; peer node start"
    environment:
      <<: *peer-env
      CORE_PEER_ID: vp29
      CORE_PEER_ADDRESS: vp29:7051
      CORE_PEER_DISCOVERY_ROOTNODE: vp0:7051
      CORE_PBFT_GENERAL_BYZANTINE: ${VP29_BYZANTINE:-false}
    volumes:
      - type: volume
        source: vp29-data
        target: /var/hyperledger/production
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${VP29_NODE:-qichang-I420-G20}

  bind9:
    image: ${BIND_IMAGE:-internetsystemsconsortium/bind9:9.18}
    hostname: bind9
    command: ["/usr/sbin/named", "-f", "-c", "/etc/bind/named.conf"]
    networks:
      - fabric
    ports:
      - target: 53
        published: ${BIND_TCP_PORT:-53}
        protocol: tcp
        mode: host
      - target: 53
        published: ${BIND_UDP_PORT:-53}
        protocol: udp
        mode: host
    volumes:
      - type: bind
        source: ${BIND_CONFIG_DIR:-/opt/fabric-dns/bind/config}
        target: /etc/bind
      - type: bind
        source: ${BIND_CACHE_DIR:-/opt/fabric-dns/bind/cache}
        target: /var/cache/bind
      - type: bind
        source: ${BIND_RECORDS_DIR:-/opt/fabric-dns/bind/records}
        target: /var/lib/bind
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${BIND_NODE:-qichang-I420-G20}

