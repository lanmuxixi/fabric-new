    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${VP9_NODE:-dns-bind-01}

  bind9:
    image: ${BIND_IMAGE:-internetsystemsconsortium/bind9:9.18}
    hostname: bind9
    command: ["/usr/sbin/named", "-f", "-c", "/etc/bind/named.conf"]
    networks:
      - fabric
    ports:
      - target: 53
        published: ${BIND_TCP_PORT:-53}
        protocol: tcp
        mode: host
      - target: 53
        published: ${BIND_UDP_PORT:-53}
        protocol: udp
        mode: host
    volumes:
      - type: bind
        source: ${BIND_CONFIG_DIR:-/opt/fabric-dns/bind/config}
        target: /etc/bind
      - type: bind
        source: ${BIND_CACHE_DIR:-/opt/fabric-dns/bind/cache}
        target: /var/cache/bind
      - type: bind
        source: ${BIND_RECORDS_DIR:-/opt/fabric-dns/bind/records}
        target: /var/lib/bind
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${BIND_NODE:-dns-bind-01}

volumes:
  vp0-data:
  vp1-data:
  vp2-data:
  vp3-data:
  vp4-data:
  vp5-data:
  vp6-data:
  vp7-data:
  vp8-data:
  vp9-data:

networks:
  fabric:
    external: true
    name: ${SWARM_NETWORK:-fabric_dns}
