    hostname: vp3
    command: /bin/sh -c "sleep ${PEER_START_DELAY:-10}; peer node start"
    environment:
      <<: *peer-env
      CORE_PEER_ID: vp3
      CORE_PEER_ADDRESS: vp3:7051
      CORE_PEER_DISCOVERY_ROOTNODE: vp0:7051
      CORE_PBFT_GENERAL_BYZANTINE: ${VP3_BYZANTINE:-false}
    volumes:
      - type: volume
        source: vp3-data
        target: /var/hyperledger/production
      - type: bind
        source: /var/run/docker.sock
