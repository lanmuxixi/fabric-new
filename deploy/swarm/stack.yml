      CORE_PBFT_GENERAL_BYZANTINE: ${VP6_BYZANTINE:-false}
    volumes:
      - type: volume
        source: vp6-data
        target: /var/hyperledger/production
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    deploy:
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == ${VP6_NODE:-dns-fabric-03}

  vp7:
    <<: *peer-common
    hostname: vp7
    command: /bin/sh -c "sleep ${PEER_START_DELAY:-10}; peer node start"
    environment:
      <<: *peer-env
      CORE_PEER_ID: vp7
      CORE_PEER_ADDRESS: vp7:7051
