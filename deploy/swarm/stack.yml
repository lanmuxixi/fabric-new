      CORE_PEER_ADDRESS: vp2:7051
      CORE_PEER_DISCOVERY_ROOTNODE: vp0:7051
      CORE_PBFT_GENERAL_BYZANTINE: ${VP2_BYZANTINE:-false}
    volumes:
